# Tool configurations
# Provides default configuration parameters for each tool

# CodeInterpreter configuration
code_interpreter:
  work_dir: "/tmp/code_interpreter"
  output_timeout: 30

  
# Zoom configuration
zoom:
  work_dir: "/tmp/zoom"
  output_timeout: 30


# WebSearch configuration
web_search:
  # Domestic workflow supports Bocha only.
  provider: "bocha"
  max_results: 10
  timeout: 10


# Visit configuration
visit:
  # Domestic workflow supports local requests + trafilatura only.
  backend: "local"
  max_content_length: 150000
  timeout: 120
  api_key: ""
  api_endpoint: ""
  model_name: "" 


# ImageSearch configuration
image_search:
  provider: "bocha"
  max_results: 5
  timeout: 30
  image_query_suffix: " 图片"
  caption_timeout: 120
